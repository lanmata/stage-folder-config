app:
  name: jobs-backend-api
  version: 0.0.1-01-2024
  api:
    endpoint: /api/v1
#<><><><><><><><><><><><><><> HTTPS <><><><><><><><><><><><><><>
server:
  port: ${JOBS_OFFER_PORT}
  http2:
    enabled: true
  ssl:
    enabled: true
    bundle: config-server
#<><><><><><><><><><><><><><> SPRING <><><><><><><><><><><><><><>
spring:
  application:
    name: ${app.name}
    description: Jobs Backend API
  cloud:
    vault:
      enabled: false
  main:
    allow-bean-definition-overriding: true
    banner-mode: console
  server:
    port: ${server.port}
    ssl:
      enabled: true
      bundle: config-server
  #<><><><><><><><><><><><><><> DATABASES <><><><><><><><><><><><><><>
  datasource:
    username: ${JOB_OFFERS_DB_USERNAME}
    password: ${JOB_OFFERS_DB_PASSWORD}
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${JOB_OFFERS_DB_NAME}
    driver-class-name: org.postgresql.Driver
    #<><><><><><><><><><><><><><> CONNECTION POOL <><><><><><><><><><><><><><>
    hikari:
      connectionTimeout: 30000
      maxLifetime: 1800000
      poolName: SpringBootJPAHikariCP-JobsBackend
      idleTimeout: 30000
      minimumIdle: 1
      maximumPoolSize: 5
  #<><><><><><><><><><><><><><> PERSISTENCE <><><><><><><><><><><><><><>
  jpa:
    hibernate.ddl-auto: none
    show-sql: true
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      jdbc:
        lob.non_contextual_creation: true
    log-level: error
  test:
    context:
      failure:
        threshold: 10000000
  #<><><><><><><><><><><><><><> SSL <><><><><><><><><><><><><><>
  ssl:
    bundle:
      jks:
        key:
          alias: ${SSL_JKS_CNFS_KEY_ALIAS}
        keystore:
          location: ${SSL_JKS_CNFS_KEYSTORE_LOCATION}
          password: ${SSL_JKS_CNFS_KEYSTORE_PASSWORD}
          type: ${SSL_JKS_CNFS_KEYSTORE_TYPE}
        trust-store:
          location: ${SSL_JKS_CONFIG_SERVER_TRUSTSTORE_LOCATION}
          password: ${SSL_JKS_CONFIG_SERVER_TRUSTSTORE_PASSWORD}
          type: ${SSL_JKS_CONFIG_SERVER_TRUSTSTORE_TYPE}
#<><><><><><><><><><><><><><> CLOUD <><><><><><><><><><><><><><>
cloud:
  discovery:
    enabled: true
  inetutils:
    ignoredInterfaces:
      - docker
      - eth.*
      - lo
    preferredNetworks:
      - 172.18.0
  output:
    ansi:
      enabled: DETECT
  #<><><><><><><><><><><><><><> JMX <><><><><><><><><><><><><><>
  jmx:
    default-domain: ${JMX_DEFAULT_DOMAIN}
  data:
    rest:
      base-path: /api
#<><><><><><><><><><><><><><> SERVICE DISCOVERY <><><><><><><><><><><><><><>
eureka:
  instance:
    home-page-url: ${SRMN_HOME_PAGE_URL_PATH}
    preferIpAddress: true
    prefer-ip-address: true
    hostName: ${SRMN_HOSTNAME}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    health-check-url: ${SRMN_HEALTH_CHECK_URL_PATH}
    status-page-url-path: ${SRMN_STATUS_PAGE_URL_PATH}
  client:
    tls:
      trust-store-type: ${SSL_JKS_SRMN_TRUSTSTORE_TYPE}
      trust-store-password: ${SSL_JKS_SRMN_TRUSTSTORE_PASSWORD}
      trust-store: ${SSL_JKS_SRMN_TRUSTSTORE_LOCATION}
      key-store-type: ${SSL_JKS_SRMN_KEYSTORE_TYPE}
      key-store-password: ${SSL_JKS_SRMN_KEYSTORE_PASSWORD}
      key-store: ${SSL_JKS_SRMN_KEYSTORE_LOCATION}
      key-password: ${SSL_JKS_SRMN_KEYSTORE_PASSWORD}
      enabled: true
    healthcheck: true
    port: ${SRMN_PORT}
    url: ${SRMN_URL}
    register-with-eureka: true
    fetch-registry: true
    enabled: true
#<><><><><><><><><><><><><><> JWT Configuration <><><><><><><><><><><><><><>
jwt:
  auth:
    converter:
      resource-id: jobs-offer-ui-client
      principal-attribute: jobs-offer-frontend-client
#<><><><><><><><><><><><><><> OPEN API DOC <><><><><><><><><><><><><><>
springdoc:
  version: ${app.version}
  api-docs:
    version: openapi_3_1
  swagger-ui:
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
  show-actuator: true
  group-configs:
    - group: All
      paths-to-match: ${app.api.endpoint}/**/**
    - group: Companies
      paths-to-match: ${app.api.endpoint}/companies/**
    - group: Job-offers
      paths-to-match: ${app.api.endpoint}/job-offers/**
    - group: Modes
      paths-to-match: ${app.api.endpoint}/modes/**
    - group: Reports
      paths-to-match: ${app.api.endpoint}/reports/**
    - group: Position
      paths-to-match: ${app.api.endpoint}/positions/**
    - group: Sources
      paths-to-match: ${app.api.endpoint}/sources/**
    - group: Source-types
      paths-to-match: ${app.api.endpoint}/source-types/**
    - group: Status
      paths-to-match: ${app.api.endpoint}/status/**
    - group: Terms
      paths-to-match: ${app.api.endpoint}/terms/**
